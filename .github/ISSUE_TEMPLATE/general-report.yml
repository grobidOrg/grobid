name: General report
description: Create a report to help us improve
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Before creating a new issue, please check the [official documentation](https://grobidorg.github.io/grobid/) and the Docker setup guide at https://grobidorg.github.io/grobid/guides/docker/docker-setup.
  - type: input
    id: grobid_version
    attributes:
      label: Grobid version
      description: Which grobid version are you using? Is it via Docker or natively? With Deep Learning models or only the lightweight CRF models? 
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System and architecture (arm64, amd64, x86, etc.)
      description: Please remember that Windows is not supported and Mac OS arm64 is still experimental.
    validations:
      required: false
  - type: input
    id: java
    attributes:
      label: What is your Java version
      description: "java --version"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log and information
      description: In case of build or run errors, please submit the error while running gradlew with ``--stacktrace`` and ``--info`` for better log traces (e.g. `./gradlew run --stacktrace --info`) or attach the log file `logs/grobid-service.log` or the console log.
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: Further information
      description: Please give us any information that could be of help
    validations:
      required: false
  
