name: Build and push a full docker image

on:
  workflow_dispatch:
    inputs:
      custom_tag:
        type: string
        description: Docker image tag
        required: true
        default: "latest-full"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew build -x test

  docker-build-full:
    needs: [ build ]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Compute GROBID version
        id: version
        run: |
          git fetch --tags --force
          echo "value=$(git describe --tags --always --first-parent)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LFOPPIANO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LFOPPIANO }}
      # This job only builds and pushes the image; the registry build cache export is
      # done by the docker-cache-export job below. With mode=max that export is several
      # GB (torch/CUDA wheels, embeddings lmdb) and takes far longer than the image push
      # itself: done here, the image would already be on Docker Hub while this job, the
      # digest and the summary all stay pending until the export ends.
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.delft
          platforms: linux/amd64
          push: true
          build-args: |
            GROBID_VERSION=${{ steps.version.outputs.value }}
          tags: |
            lfoppiano/grobid:latest-full,lfoppiano/grobid:${{ github.event.inputs.custom_tag }}
          # Registry cache rather than type=gha. The GitHub Actions cache is capped at
          # 10GB per repository with LRU eviction, and mode=max on this image exports far
          # more than that -- the torch/CUDA wheels alone are ~5GB and the embeddings lmdb
          # ~2GB -- so entries were being evicted between runs and the "cached" layers
          # rebuilt anyway. Docker Hub has no such ceiling, and the push happens over the
          # login already done above.
          cache-from: type=registry,ref=lfoppiano/grobid:buildcache
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Docker Image Summary
        env:
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          {
            echo "## 🐳 Docker Image Uploaded Successfully"
            echo ""
            echo "**Image Details:**"
            echo "- **Registry:** docker.io"
            echo "- **Image:** lfoppiano/grobid"
            echo "- **Type:** Full build with DeLFT models"
            echo "- **Tags:**"
            echo "  - \`latest-full\`"
            echo "  - \`${CUSTOM_TAG}\`"
            echo "- **Digest:** \`${DIGEST}\`"
            echo "- **Platforms:** linux/amd64"
            echo ""
            echo "**Usage:**"
            echo '```bash'
            echo "docker pull lfoppiano/grobid:${CUSTOM_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Refreshes lfoppiano/grobid:buildcache once the image is published. It runs on a
  # fresh runner, so it rebuilds the image with the same inputs: the multi-GB layers
  # (pip install, embeddings preload) sit above the source-dependent layers and are
  # cache hits from the registry, only the gradle stage is actually rebuilt. Blobs
  # already present in the registry are not re-uploaded by the export.
  #
  # `type=cacheonly` keeps it from producing (and pushing) a second image, and
  # continue-on-error plus ignore-error keep a failed or slow export from failing
  # a workflow whose image is already published.
  docker-cache-export:
    needs: [ docker-build-full ]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Compute GROBID version
        id: version
        run: |
          git fetch --tags --force
          echo "value=$(git describe --tags --always --first-parent)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LFOPPIANO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LFOPPIANO }}
      - name: Export build cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.delft
          platforms: linux/amd64
          build-args: |
            GROBID_VERSION=${{ steps.version.outputs.value }}
          outputs: type=cacheonly
          cache-from: type=registry,ref=lfoppiano/grobid:buildcache
          cache-to: type=registry,ref=lfoppiano/grobid:buildcache,mode=max,ignore-error=true
      - name: Build cache summary
        env:
          DIGEST: ${{ needs.docker-build-full.outputs.digest }}
        run: |
          {
            echo "## 📦 Build Cache"
            echo "Registry build cache \`lfoppiano/grobid:buildcache\` updated for image digest \`${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
